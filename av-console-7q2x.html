<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Console</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0f0e13">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="/assets/icons/favicon-48.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="adm">

<main id="login-view" class="adm-login">
  <form id="login-form" class="adm-card" autocomplete="off" novalidate>
    <img src="/assets/logo.jpg" alt="" width="64" height="64">
    <h1>Console</h1>
    <p class="adm-sub">Authorised staff only. Every attempt is logged.</p>
    <label class="adm-f"><span>Username</span><input name="username" type="text" autocomplete="username" maxlength="80" required></label>
    <label class="adm-f"><span>Password</span><input name="password" type="password" autocomplete="current-password" maxlength="200" required></label>
    <label class="adm-f"><span>6-digit code</span><input name="otp" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" required></label>
    <div class="adm-msg" id="login-msg" role="alert"></div>
    <button class="btn primary" type="submit" id="login-btn">Sign in</button>
  </form>
</main>

<div id="console" class="adm-shell" hidden>
  <aside class="adm-side">
    <div class="adm-brand"><img src="/assets/logo.jpg" alt="" width="34" height="34"><b>Console</b></div>
    <nav id="tabs"></nav>
    <button class="btn sm" id="logout" type="button">Sign out</button>
  </aside>
  <section class="adm-main">
    <header class="adm-top"><h2 id="title">Overview</h2><span class="adm-live" id="live"></span></header>
    <div id="panel"></div>
  </section>
</div>
<div class="toast-wrap" id="toasts"></div>

<script src="/assets/icons.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
